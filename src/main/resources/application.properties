server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/infinitycapital}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
market.data.api-url=${MARKET_DATA_API_URL:}
market.data.api-token=${MARKET_DATA_API_TOKEN:}
market.data.source=${MARKET_DATA_SOURCE:Authorized market data provider}
